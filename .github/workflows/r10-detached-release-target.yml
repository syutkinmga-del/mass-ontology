name: P04-07 R10 Detached Release Target

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detached-r10-review:
    name: R10 separate authorization for immutable v0.4.0 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout governance registration with complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Independently review earlier candidate and read later R10 authorization
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_p04_r10_detached_target.py \
            --report run/release-review/p04-07-detached-r10.json

      - name: Upload report including expected authorization NO-GO
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p04-07-detached-r10-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/release-review/p04-07-detached-r10.json
          if-no-files-found: error
          retention-days: 30
