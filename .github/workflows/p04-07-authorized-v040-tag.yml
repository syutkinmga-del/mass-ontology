name: P04-07 Issue Owner-Authorized Annotated v0.4.0 Tag

on:
  push:
    branches: [main]
    paths:
      - 'docs/governance/P04-07-R10-2026-02-release-target.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  annotated-v040-tag:
    name: Verify detached R10 and create exact-target annotated tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out governance registration with full Git ancestry and tag refs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Enforce exact-SHA R10 authorization against detached release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'syutkinmga-del/mass-ontology'
          test "$GITHUB_REF" = 'refs/heads/main'
          python scripts/verify_p04_r10_detached_target.py \
            --report run/release-review/p04-07-tag-approval.json

      - name: Independently verify successful Actions executions on approved commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GH_REPO']
          token=os.environ['GH_TOKEN']
          target='d0f2368df4268cfe3c6079a1681502cad0b867fb'
          evidence={
              42217787701:'Validate MASS Ontology',
              42217787880:'BH-P04 Behavior Validation',
          }
          for run_id, expected_name in evidence.items():
              req=urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  item=json.load(response)
              if not (
                  item.get('head_sha')==target
                  and item.get('status')=='completed'
                  and item.get('conclusion')=='success'
                  and item.get('name')==expected_name
              ):
                  raise SystemExit(f'BLOCKED: exact target CI evidence {run_id} does not match')
              print(f'PASS CI {run_id}: {expected_name} at {target}')
          PY

      - name: Create annotated v0.4.0 ONLY on approved immutable SHA
        shell: bash
        run: |
          set -euo pipefail
          target='d0f2368df4268cfe3c6079a1681502cad0b867fb'
          git cat-file -e "$target^{commit}"
          git fetch --force origin '+refs/tags/*:refs/tags/*'
          if git show-ref --verify --quiet refs/tags/v0.4.0; then
            kind="$(git cat-file -t refs/tags/v0.4.0)"
            peeled="$(git rev-parse 'refs/tags/v0.4.0^{commit}')"
            if [ "$kind" != 'tag' ] || [ "$peeled" != "$target" ]; then
              echo "::error::Existing v0.4.0 tag is not annotated at approved SHA. No alteration made."
              exit 1
            fi
            echo 'Existing annotated v0.4.0 tag points to approved SHA; no new tag created.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v0.4.0 "$target" \
              -m 'MASS Ontology v0.4.0 — BH-P04 Observation Core' \
              -m 'Owner explicit text approval P04-07-R10-2026-02; approval not an electronic signature.' \
              -m "Exactly approved source commit: $target" \
              -m 'Validation: GitHub Actions 42217787701 / 42217787880 and detached R01–R10 gate.'
            test "$(git rev-parse 'refs/tags/v0.4.0^{commit}')" = "$target"
            test "$(git cat-file -t refs/tags/v0.4.0)" = 'tag'
            git push origin refs/tags/v0.4.0
            echo "Created annotated v0.4.0 at approved SHA $target"
          fi

      - name: Upload detached exact-SHA approval evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p04-07-tag-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/release-review/p04-07-tag-approval.json
          if-no-files-found: error
          retention-days: 30
