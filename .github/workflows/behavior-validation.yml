name: BH-P04 Behavior Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bh-p04-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior-p04:
    name: BH-P04 Python / SHACL / HermiT / CQ / baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout complete Git history for evidence ancestry
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up Temurin Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned direct Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r ci/requirements-behavior-ci.txt
          .venv/bin/python -m pip check
          .venv/bin/python -m pip freeze > "$RUNNER_TEMP/python-resolved.txt"

      - name: Install SHA-256 verified ROBOT v1.9.11 with HermiT
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/ontodev/robot/releases/download/v1.9.11/robot.jar' \
            --output "$RUNNER_TEMP/robot.jar"
          (cd "$RUNNER_TEMP" && sha256sum -c "$GITHUB_WORKSPACE/ci/robot-v1.9.11.sha256")
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec java -jar "%s" "$@"\n' "$RUNNER_TEMP/robot.jar" \
            > "$RUNNER_TEMP/bin/robot"
          chmod 755 "$RUNNER_TEMP/bin/robot"
          "$RUNNER_TEMP/bin/robot" --version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "ROBOT_JAR=$RUNNER_TEMP/robot.jar" >> "$GITHUB_ENV"

      - name: Run mandatory BH-P04 fail-closed gates
        shell: bash
        run: |
          set -euo pipefail
          make behavior-test

      - name: Verify RR-05 exact notices bytes and owner text approval
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python scripts/verify_p04_rr05_notices.py --require-approval

      - name: Publish CI summary
        if: always()
        shell: bash
        run: |
          if [ -f run/behavior-ci/summary.md ]; then
            cat run/behavior-ci/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'BH-P04 validation did not produce evidence; job is not accepted.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload execution evidence (including failures)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bh-p04-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/behavior-ci/
          if-no-files-found: warn
          retention-days: 30
