name: Validate MASS Ontology

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  shacl-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rdflib pyshacl owlready2 pytest requests

      - name: Run SHACL validation
        run: |
          python scripts/run_shacl.py
