name: P05-D05 Exact Owner Text Approval (Alternative B)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p05-d05-approval:
    name: D05 detached owner approval and unchanged P05-00 / v0.4.0 history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout owner-registration revision with complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify exact user authorization against earlier immutable ADR and tag
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/verify_p05_d05_owner_approval.py tests/test_p05_d05_owner_approval.py
          python scripts/verify_p05_d05_owner_approval.py \
            --report run/p05-d05/approval-review.json

      - name: Run approval provenance and mutation tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==9.1.1
          python -m pytest -q -ra tests/test_p05_d05_owner_approval.py

      - name: Save verification evidence even on rejected authorization
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p05-d05-owner-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/p05-d05/approval-review.json
          if-no-files-found: warn
          retention-days: 60
